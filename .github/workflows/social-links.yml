name: Live social links

on:
  workflow_dispatch:
    inputs:
      link_ids:
        description: Comma-separated case IDs from social-links.json (empty runs every case)
        required: false
        default: ""
  schedule:
    - cron: "41 6 * * 2"

permissions:
  contents: read

concurrency:
  group: live-social-links
  cancel-in-progress: false

jobs:
  social-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Unfurlit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm

      - name: Install managed-device system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;aosp_atd;x86_64"

      - name: Check the link fixture
        run: python3 scripts/social_links_report.py --check

      - name: Test public social links
        env:
          LINK_IDS: ${{ inputs.link_ids }}
        run: |
          selection=()
          if [ -n "${LINK_IDS// /}" ]; then
            selection=("-Pandroid.testInstrumentationRunnerArguments.linkId=${LINK_IDS// /}")
          fi
          ./gradlew --no-daemon pixel2Api30DebugAndroidTest \
            -Punfurlit.ci.x86_64=true \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.testInstrumentationRunnerArguments.liveLinks=true \
            -Pandroid.testInstrumentationRunnerArguments.class=io.github.originalrecipe1.unfurlit.data.extractor.ytdlp.SocialLinksTest \
            "${selection[@]}"

      - name: Summarize results by media type
        if: always()
        run: python3 scripts/social_links_report.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload per-link test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: social-link-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
