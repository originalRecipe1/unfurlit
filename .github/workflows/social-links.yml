name: Live social links

on:
  workflow_dispatch:
    inputs:
      link_ids:
        description: Comma-separated case IDs from social-links.json (empty runs every case)
        required: false
        default: ""
  schedule:
    - cron: "41 6 * * 2"

permissions:
  contents: read

concurrency:
  group: live-social-links
  cancel-in-progress: false

jobs:
  social-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Unfurlit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm

      - name: Install managed-device system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;aosp_atd;x86_64"

      - name: Check the link fixture
        env:
          LINK_IDS: ${{ inputs.link_ids }}
        run: python3 scripts/social_links_report.py --check --link-ids "$LINK_IDS"

      - name: Build the release extractor from source
        id: extractor
        run: |
          ./scripts/build_yt_dlp_from_source.sh
          source_file="$PWD/build/yt-dlp-source/yt-dlp"
          source_sha="$(sha256sum "$source_file" | awk '{ print $1 }')"
          echo "file=$source_file" >> "$GITHUB_OUTPUT"
          echo "sha256=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Test public social links
        id: live_tests
        # Keep the raw JUnit failures; the report gates the job on their classification.
        continue-on-error: true
        env:
          LINK_IDS: ${{ inputs.link_ids }}
        run: |
          selection=()
          if [ -n "${LINK_IDS// /}" ]; then
            selection=("-Pandroid.testInstrumentationRunnerArguments.linkId=${LINK_IDS// /}")
          fi
          ./gradlew --no-daemon pixel2Api30DebugAndroidTest \
            -Punfurlit.ci.x86_64=true \
            -Punfurlit.ytdlp.file="${{ steps.extractor.outputs.file }}" \
            -Punfurlit.ytdlp.sha256="${{ steps.extractor.outputs.sha256 }}" \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.testInstrumentationRunnerArguments.liveLinks=true \
            -Pandroid.testInstrumentationRunnerArguments.class=io.github.originalrecipe1.unfurlit.data.extractor.ytdlp.SocialLinksTest \
            "${selection[@]}"

      - name: Classify results and fail on unexpected problems
        if: always()
        shell: bash
        env:
          LINK_IDS: ${{ inputs.link_ids }}
        run: |
          mkdir -p app/build/reports/social-links
          python3 scripts/social_links_report.py \
            --link-ids "$LINK_IDS" \
            --test-step-outcome "${{ steps.live_tests.outcome }}" \
            --json-output app/build/reports/social-links/results.json \
            | tee -a "$GITHUB_STEP_SUMMARY" app/build/reports/social-links/summary.md

      - name: Upload per-link test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: social-link-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/social-links/
          retention-days: 14
