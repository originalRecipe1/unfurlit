name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, and APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out Unfurlit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Test build and test-link scripts
        run: python3 -m unittest discover -s scripts/tests

      - name: Check extractor dependency notices
        run: python3 scripts/update_yt_dlp_notices.py --check

      - name: Build debug APK with the official extractor
        run: ./gradlew --no-daemon assembleDebug

      - name: Build the release extractor from source
        id: extractor
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build_yt_dlp_from_source.sh
          source_file="$PWD/build/yt-dlp-source/yt-dlp"
          python3 - "$source_file" app/build/generated/unfurlitYtDlp/res/raw/ytdlp <<'PY'
          import hashlib
          import sys
          from zipfile import ZipFile
          # The first debug build downloaded and hash-verified this official asset.
          with ZipFile(sys.argv[1]) as source, ZipFile(sys.argv[2]) as official:
              for name in ("core.min.js", "lib.min.js"):
                  path = f"yt_dlp_ejs/yt/solver/{name}"
                  output = source.read(path)
                  assert output and output == official.read(path), f"{name} differs from the official solver"
                  print(f"Verified official solver bytes: {name} {hashlib.sha256(output).hexdigest()}")
          PY
          echo "file=$source_file" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$source_file" | awk '{ print $1 }')" >> "$GITHUB_OUTPUT"

      - name: Verify the Android project
        run: >-
          ./gradlew --no-daemon :buildSrc:test testDebugUnitTest lintDebug assembleDebug
          assembleDebugAndroidTest assembleRelease assembleLinkCheck
          -Punfurlit.ytdlp.file="${{ steps.extractor.outputs.file }}"
          -Punfurlit.ytdlp.sha256="${{ steps.extractor.outputs.sha256 }}"

      - name: Upload the link-check APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unfurlit-link-check-apk
          path: app/build/outputs/apk/linkCheck/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the unsigned release APK for reproducibility checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unfurlit-unsigned-release-apk
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 14

  instrumented-tests:
    name: Deterministic UI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out Unfurlit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm

      - name: Install managed-device system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-30;aosp_atd;x86_64"

      - name: Run deterministic UI tests
        run: >-
          ./gradlew --no-daemon pixel2Api30DebugAndroidTest
          -Punfurlit.ci.x86_64=true
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload failed UI test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: managed-device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
