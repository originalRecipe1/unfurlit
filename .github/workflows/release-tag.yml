name: Publish release tag

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release-tag
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'automation/yt-dlp-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Read the app release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_code="$(sed -nE 's/^\s*versionCode = ([0-9]+)$/\1/p' app/build.gradle.kts)"
          version_name="$(sed -nE 's/^\s*versionName = "([^"]+)"$/\1/p' app/build.gradle.kts)"
          if [[ ! "$version_code" =~ ^[0-9]+$ ]] || [[ ! "$version_name" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "Could not read a safe literal app version" >&2
            exit 1
          fi
          tag="v$version_name"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the release commit
        if: steps.version.outputs.create == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build_yt_dlp_from_source.sh
          source_file="$PWD/build/yt-dlp-source/yt-dlp"
          source_sha="$(sha256sum "$source_file" | awk '{ print $1 }')"
          ./gradlew --no-daemon :buildSrc:test testReleaseUnitTest lintRelease assembleRelease \
            -Punfurlit.ytdlp.file="$source_file" \
            -Punfurlit.ytdlp.sha256="$source_sha"

      - name: Sign the release APK
        if: steps.version.outputs.create == 'true'
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail

          configured=0
          for value in "$SIGNING_KEYSTORE_BASE64" "$SIGNING_KEY_ALIAS" \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "$configured" -ne 4 ]]; then
            echo "All four Android signing secrets are required for reproducible releases" >&2
            exit 1
          fi

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0"
          signing_dir="$RUNNER_TEMP/unfurlit-signing"
          mkdir -p "$signing_dir"
          keystore_file="$signing_dir/release.keystore"
          unsigned_apk="$PWD/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned_apk="$signing_dir/Unfurlit-$VERSION_NAME-aligned.apk"
          signed_apk="$signing_dir/Unfurlit-$VERSION_NAME.apk"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"

          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -p -f 4 "$unsigned_apk" "$aligned_apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$keystore_file" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed_apk" \
            "$aligned_apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$signed_apk"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c 4 "$signed_apk"

          checksum_file="$signed_apk.sha256"
          (cd "$signing_dir" && sha256sum "$(basename "$signed_apk")" > "$(basename "$checksum_file")")
          mapping_file="$signing_dir/Unfurlit-$VERSION_NAME-mapping.txt"
          cp app/build/outputs/mapping/release/mapping.txt "$mapping_file"
          echo "apk=$signed_apk" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum_file" >> "$GITHUB_OUTPUT"
          echo "mapping=$mapping_file" >> "$GITHUB_OUTPUT"

      - name: Create the tag and GitHub release
        if: steps.version.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SIGNED_APK: ${{ steps.signing.outputs.apk }}
          SIGNED_CHECKSUM: ${{ steps.signing.outputs.checksum }}
          R8_MAPPING: ${{ steps.signing.outputs.mapping }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$VERSION_NAME" =~ (alpha|beta|rc|experiment) ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Unfurlit $VERSION_NAME" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt" \
            "$SIGNED_APK" \
            "$SIGNED_CHECKSUM" \
            "$R8_MAPPING" \
            "${release_flags[@]}"
