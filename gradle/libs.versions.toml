[versions]
agp = "8.13.2"
kotlin = "2.2.10"
composeBom = "2025.08.00"
activityCompose = "1.10.1"
lifecycle = "2.9.2"
paging = "3.3.6"
media3 = "1.11.0"
okhttp = "4.12.0"
